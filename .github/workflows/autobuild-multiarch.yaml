# Build clangd release binaries for every supported OS/architecture.
#
# This workflow is additive: it does not modify, reuse or depend on
# autobuild.yaml or winget.yml. Targets:
#
#   linux-x86_64    built inside an Ubuntu 20.04 container, using exactly the
#                   same old-glibc scheme as autobuild.yaml:
#                     - lib_compat.h pins the libm symbols to GLIBC_2.2.5
#                     - -static-libgcc + LLVM_STATIC_LINK_CXX_STDLIB=ON
#                     - LLVM_ENABLE_ZLIB=FORCE_ON with linux-static-deps.cmake
#                       forcing the static libz.a
#                     - lib_compat_test.py --lib=GLIBC_2.18, the same
#                       whitelist the original workflow enforces
#                   GLIBC_2.18 only added __cxa_thread_atexit_impl, which is a
#                   weak reference, so the resulting binary still runs on
#                   systems with glibc 2.17.
#   linux-aarch64   built natively on an Ubuntu 24.04 arm64 runner.
#   windows-x86_64  built natively with MSVC on windows-2022.
#   winarm64        built natively with MSVC on a Windows 11 arm64 runner.
#   macos-x86_64    native x86_64 build on macos-15-intel (deployment 10.13)
#   macos-arm64     native arm64 build on macos-15 (deployment 11.0)
#                   The two slices are combined into one universal bundle by
#                   the macos-universal job. Building universal in a single
#                   job does not work: BoringSSL has per-architecture sources
#                   and ends up with fat archives that contain objects for the
#                   wrong architecture, and Homebrew >= formulae only ship the
#                   native slice.
#
# Builds are published as workflow artifacts. When `release_tag` is given, a
# single short job at the end attaches them to a GitHub release. Doing the
# upload in a separate job (instead of from each long-running build job)
# avoids the "token expired after one hour" problem that release uploads from
# multi-hour build jobs run into.
#
# Asset naming note: assets that would collide with the winget publishing
# workflow (which looks for `clangd-windows-*.zip`) are kept unique. Only the
# x86_64 Windows archive starts with `clangd-windows-`; the arm64 one is
# published as `clangd-winarm64-*` so winget keeps picking the x64 build.
name: Build multi-arch release binaries

on:
  # Run weekly on sunday at 21:37 UTC (arbitrary, same slot as autobuild.yaml).
  schedule:
  - cron: '37 21 * * SUN'
  workflow_dispatch:
    inputs:
      llvm_repo:
        description: 'LLVM repository to build from (owner/name)'
        required: false
        default: 'llvm/llvm-project'
      llvm_commit:
        description: 'LLVM commit SHA (default: tip of the default branch)'
        required: false
        default: ''
      release_tag:
        description: 'Publish a GitHub release under this tag (default: artifacts only)'
        required: false
        default: ''
      release_name:
        description: 'Release title (default: "<date> @<short commit>")'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve build inputs
    runs-on: ubuntu-latest
    outputs:
      llvm_repo: ${{ steps.resolve.outputs.llvm_repo }}
      llvm_commit: ${{ steps.resolve.outputs.llvm_commit }}
      tag_name: ${{ steps.resolve.outputs.tag_name }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      release_name: ${{ steps.resolve.outputs.release_name }}
    steps:
    - name: Resolve repository, commit and tag
      id: resolve
      shell: bash
      env:
        INPUT_REPO: ${{ github.event.inputs.llvm_repo }}
        INPUT_COMMIT: ${{ github.event.inputs.llvm_commit }}
        INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        INPUT_RELEASE_NAME: ${{ github.event.inputs.release_name }}
      run: |
        set -euo pipefail
        repo="${INPUT_REPO:-llvm/llvm-project}"
        commit="${INPUT_COMMIT:-}"
        if [ -z "$commit" ]; then
          for branch in main master; do
            commit="$(curl -fsSL "https://api.github.com/repos/${repo}/commits/${branch}" |
              jq -r '.sha // empty' || true)"
            [ -n "$commit" ] && break
          done
        fi
        if [ -z "$commit" ]; then
          echo "::error::Could not resolve the LLVM commit for ${repo}"
          exit 1
        fi
        date="$(date -u +%Y%m%d)"
        tag="${INPUT_RELEASE_TAG:-snapshot_${date}}"
        name="${INPUT_RELEASE_NAME:-${date} @$(printf '%.12s' "$commit")}"
        {
          echo "llvm_repo=${repo}"
          echo "llvm_commit=${commit}"
          echo "tag_name=${tag}"
          echo "release_tag=${INPUT_RELEASE_TAG:-}"
          echo "release_name=${name}"
        } >>"$GITHUB_OUTPUT"
        cat "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.config.name }}
    needs: prepare
    runs-on: ${{ matrix.config.os }}
    container: ${{ matrix.config.container }}
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: linux-x86_64
          os: ubuntu-24.04
          container: ubuntu:20.04
          # Same approach as autobuild.yaml: build in a container whose glibc
          # is old enough that clangd does not pick up newer symbols, force the
          # few libm symbols that would otherwise be versioned higher via
          # lib_compat.h, link libstdc++/libgcc statically, and force the static
          # libz.a so nothing new leaks into the dynamic dependency list.
          preinstall: >-
            apt-get update &&
            apt-get install -y ninja-build libz-dev libc-ares-dev wget clang-12
            software-properties-common p7zip-full curl binutils python3 &&
            add-apt-repository ppa:git-core/ppa &&
            apt-get update &&
            apt-get install -y git python3.8 python3.8-dev
          # focal ships CMake 3.16, the Kitware bionic repo tops out at 3.25.2
          # and current LLVM wants >= 3.31, so install a pinned CMake instead.
          cmake_url: https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-linux-x86_64.tar.gz
          cflags: -O3 -gline-tables-only -DNDEBUG -include $GITHUB_WORKSPACE/.github/workflows/lib_compat.h
          # clang-12 rather than clang-10: current LLVM no longer builds with
          # the focal default toolchain.
          cmake: >-
            "-DCMAKE_C_COMPILER=clang-12"
            "-DCMAKE_CXX_COMPILER=clang++-12"
            "-DCMAKE_EXE_LINKER_FLAGS_RELEASE=-static-libgcc -Wl,--compress-debug-sections=zlib"
            "-DLLVM_STATIC_LINK_CXX_STDLIB=ON"
            "-DLLVM_ENABLE_ZLIB=FORCE_ON"
            "-DCMAKE_PROJECT_INCLUDE=$GITHUB_WORKSPACE/.github/workflows/linux-static-deps.cmake"
          grpc_version: v1.36.3
          # Using c-ares as a module prevents dynamic linking of unneeded
          # libraries. All other gRPC dependencies can be built from sources.
          grpc_cmake: >-
            "-DgRPC_CARES_PROVIDER=package"
          # Same whitelist as autobuild.yaml. GLIBC_2.18's only addition is
          # __cxa_thread_atexit_impl, referenced weakly, so this still yields a
          # binary usable on glibc 2.17 systems.
          compat_lib: GLIBC_2.18
          exe: ""
        - name: linux-aarch64
          os: ubuntu-24.04-arm
          preinstall: >-
            sudo apt-get update &&
            sudo apt-get install -y ninja-build zlib1g-dev libstdc++-13-dev
            p7zip-full clang-18 python3 curl
          # Noble ships CMake 3.28, below the 3.31 LLVM now requires.
          cmake_url: https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-linux-aarch64.tar.gz
          cflags: -O3 -gline-tables-only -DNDEBUG
          # gRPC's CMake config looks up absl / c-ares / re2 / protobuf in
          # config mode without REQUIRED, so a miss surfaces later as
          # "link interface contains absl::strings but the target was not
          # found" inside gRPCTargets.cmake. Point CMAKE_PREFIX_PATH at the
          # gRPC install prefix so every sibling dependency resolves.
          cmake: >-
            "-DCMAKE_C_COMPILER=clang-18"
            "-DCMAKE_CXX_COMPILER=clang++-18"
            "-DCMAKE_EXE_LINKER_FLAGS_RELEASE=-static-libgcc -Wl,--compress-debug-sections=zlib"
            "-DLLVM_STATIC_LINK_CXX_STDLIB=ON"
            "-DLLVM_ENABLE_ZLIB=FORCE_ON"
            "-DCMAKE_PROJECT_INCLUDE=$GITHUB_WORKSPACE/.github/workflows/linux-static-deps.cmake"
            "-DCMAKE_PREFIX_PATH=$HOME/grpc-installation"
          # Newer gRPC: the pinned v1.36.3 predates arm64 support and its
          # bundled abseil does not compile with GCC 13 / libstdc++ 13.
          grpc_version: v1.62.2
          grpc_cmake: >-
            "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
          exe: ""
        - name: windows-x86_64
          os: windows-2022
          preinstall: choco install ninja nasm
          msvc_arch: x64
          msvc_component: x86.x64
          cflags: /O2 /DNDEBUG
          cmake: >-
            "-DCMAKE_C_COMPILER=cl"
            "-DCMAKE_CXX_COMPILER=cl"
            "-DLLVM_ENABLE_ZLIB=OFF"
            "-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded"
            "-DLLVM_ENABLE_PDB=ON"
            "-DLLVM_PARALLEL_LINK_JOBS=1"
          grpc_version: v1.36.3
          grpc_cmake: >-
            "-DgRPC_MSVC_STATIC_RUNTIME=ON"
          exe: ".exe"
        - name: winarm64
          # Pinned to the VS2026 image explicitly: the plain `windows-11-arm`
          # label had no Visual Studio at all before it was re-pointed at this
          # image, so use the explicit label to stay deterministic.
          os: windows-11-vs2026-arm
          msvc_arch: arm64
          msvc_component: ARM64
          cflags: /O2 /DNDEBUG
          # CMAKE_DISABLE_PRECOMPILE_HEADERS: the native arm64 MSVC (14.52)
          # crashes with C1001 (internal compiler error, stack frame
          # UtcBldCompileSerializedFile) while compiling
          # mlir-tblgen/OpDefinitionsGen.cpp against the LLVMSupport PCH.
          # Building without PCH avoids the ICE; it costs build time only.
          cmake: >-
            "-DCMAKE_C_COMPILER=cl"
            "-DCMAKE_CXX_COMPILER=cl"
            "-DLLVM_ENABLE_ZLIB=OFF"
            "-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded"
            "-DLLVM_ENABLE_PDB=ON"
            "-DLLVM_PARALLEL_LINK_JOBS=1"
            "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
            "-DCMAKE_PREFIX_PATH=$HOME/grpc-installation"
            "-DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON"
          grpc_version: v1.62.2
          # BoringSSL has no arm64 Windows assembler path under MSVC.
          grpc_cmake: >-
            "-DgRPC_MSVC_STATIC_RUNTIME=ON"
            "-DOPENSSL_NO_ASM=ON"
          exe: ".exe"
        # macOS is built twice, natively, and the two slices are lipo'd
        # together by the macos-universal job below. A single universal build
        # on one host is not workable here: BoringSSL has arch-specific source
        # files and ends up producing fat archives with objects for the wrong
        # architecture ("libcrypto.a(cpu_aarch64_linux.c.o) has no symbols"),
        # and a Homebrew dependency is only ever built for the native slice.
        - name: macos-x86_64
          os: macos-15-intel
          preinstall: brew install ninja zlib p7zip
          # The image's CMake is 4.x, which rejects the cmake_minimum_required
          # of older gRPC releases. Pin 3.31 instead.
          cmake_url: https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-macos-universal.tar.gz
          cflags: -O3 -gline-tables-only -DNDEBUG
          cmake: >-
            "-DCMAKE_C_COMPILER=clang"
            "-DCMAKE_CXX_COMPILER=clang++"
            "-DLLVM_ENABLE_ZLIB=FORCE_ON"
            "-DCMAKE_OSX_ARCHITECTURES=x86_64"
            "-DCMAKE_OSX_DEPLOYMENT_TARGET=10.13"
            "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
            "-DCMAKE_PREFIX_PATH=$HOME/grpc-installation"
          grpc_version: v1.62.2
          grpc_cmake: >-
            "-DOPENSSL_NO_ASM=ON"
          exe: ""
        - name: macos-arm64
          os: macos-15
          preinstall: brew install ninja zlib p7zip
          cmake_url: https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-macos-universal.tar.gz
          cflags: -O3 -gline-tables-only -DNDEBUG
          cmake: >-
            "-DCMAKE_C_COMPILER=clang"
            "-DCMAKE_CXX_COMPILER=clang++"
            "-DLLVM_ENABLE_ZLIB=FORCE_ON"
            "-DCMAKE_OSX_ARCHITECTURES=arm64"
            "-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0"
            "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
            "-DCMAKE_PREFIX_PATH=$HOME/grpc-installation"
          grpc_version: v1.62.2
          grpc_cmake: >-
            "-DOPENSSL_NO_ASM=ON"
          exe: ""
    steps:
    - name: Clone build scripts
      uses: actions/checkout@v5
    # The MSVC environment is located through vswhere instead of hardcoding
    # the install path, so the same step works for VS2022 on windows-2022 and
    # for VS2026 on the arm64 image, in any edition.
    - name: Set up MSVC environment
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
        if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found: $vswhere" }
        $component = "Microsoft.VisualStudio.Component.VC.Tools.${{ matrix.config.msvc_component }}"
        $vsPath = & $vswhere -latest -products * -requires $component -property installationPath
        if (-not $vsPath) { throw "No Visual Studio installation provides $component" }
        $vcvars = Join-Path $vsPath 'VC\Auxiliary\Build\vcvarsall.bat'
        Write-Host "Using $vcvars with architecture ${{ matrix.config.msvc_arch }}"
        cmd /c "`"$vcvars`" ${{ matrix.config.msvc_arch }} >NUL && set" | ForEach-Object {
          $name, $value = $_ -split '=', 2
          if ($value) { "$name=$value" >> $env:GITHUB_ENV }
        }
    - name: Install tools
      if: ${{ matrix.config.preinstall }}
      run: ${{ matrix.config.preinstall }}
    # Current llvm-project requires CMake >= 3.31, and the images we build on
    # ship either older ones (focal: 3.16 via apt, noble: 3.28) or a 4.x that
    # is too new for the pinned gRPC release. Download one known version and
    # put it in front of PATH. The macOS tarball nests the binaries in
    # CMake.app/Contents/bin, hence the layout probe.
    - name: Install pinned CMake
      if: ${{ matrix.config.cmake_url }}
      shell: bash
      run: |
        set -euo pipefail
        dest="$HOME/.local/cmake"
        mkdir -p "$dest"
        curl -fsSL "${{ matrix.config.cmake_url }}" -o "$HOME/cmake.tar.gz"
        tar -xzf "$HOME/cmake.tar.gz" -C "$dest" --strip-components=1
        bindir="$dest/bin"
        [ -x "$bindir/cmake" ] || bindir="$dest/CMake.app/Contents/bin"
        [ -x "$bindir/cmake" ] || { echo "::error::cmake not found in the archive"; exit 1; }
        "$bindir/cmake" --version
        echo "$bindir" >>"$GITHUB_PATH"
    - name: Show toolchain versions
      shell: bash
      run: |
        cmake --version | head -1
        ninja --version
    - name: Clone gRPC
      uses: actions/checkout@v5
      with:
        repository: grpc/grpc
        path: grpc
        ref: ${{ matrix.config.grpc_version }}
        submodules: recursive
    - name: Build gRPC
      run: >
        mkdir $HOME/grpc-installation

        mkdir grpc-build

        cmake -G Ninja -S grpc -B grpc-build
        "-DgRPC_INSTALL=ON"
        "-DCMAKE_INSTALL_PREFIX=$HOME/grpc-installation"
        "-DCMAKE_BUILD_TYPE=Release"
        "-DCMAKE_C_FLAGS_RELEASE=${{ matrix.config.cflags }}"
        "-DCMAKE_CXX_FLAGS_RELEASE=${{ matrix.config.cflags }}"
        ${{ matrix.config.grpc_cmake }} ${{ matrix.config.cmake }}

        ninja -C grpc-build install
    # GitHub job logs need authentication to download, so a failed run is
    # otherwise a black box. Replay the failing build (ninja resumes where it
    # stopped) and republish the first errors as workflow annotations, which
    # are readable anonymously.
    - name: Report gRPC build errors
      if: failure()
      shell: bash
      run: |
        set +e
        if [ ! -f grpc-build/build.ninja ]; then
          echo "::error::gRPC configure failed (no grpc-build/build.ninja was produced)"
          exit 0
        fi
        ninja -C grpc-build install 2>&1 |
          grep -a -E "error:|FAILED:|fatal error|CMake Error" |
          head -5 | tr -d '\r' |
          while IFS= read -r line; do echo "::error::$(printf '%s' "$line" | sed 's/%/%25/g')"; done
        exit 0
    - name: Clone LLVM
      uses: actions/checkout@v5
      with:
        repository: ${{ needs.prepare.outputs.llvm_repo }}
        path: llvm-project
        ref: ${{ needs.prepare.outputs.llvm_commit }}
    - name: Set build directory
      shell: bash
      run: echo "CLANGD_DIR=clangd_${{ needs.prepare.outputs.tag_name }}" >> "$GITHUB_ENV"
    # clangd's remote-index monitor calls Status::message().as_string().
    # as_string() only exists when absl::string_view is Abseil's own type: from
    # abseil 20230125 on, options.h hard-codes ABSL_OPTION_USE_STD_STRING_VIEW 2
    # so in C++17 it becomes an alias for std::string_view, and the call fails
    # with "no member named 'as_string' in 'std::basic_string_view<char>'".
    # Upstream never sees this because autobuild.yaml pins gRPC 1.36.3; on
    # arm64 and macOS we need a newer gRPC, so make this one call work with
    # either type. It is a no-op for old protobuf and stays correct if the
    # pattern disappears (an upstream fix), hence no hard failure.
    - name: Patch clangd remote monitor for newer protobuf
      shell: bash
      run: |
        f=llvm-project/clang-tools-extra/clangd/index/remote/monitor/Monitor.cpp
        if ! grep -q 'JsonStatus\.message()\.as_string()' "$f"; then
          echo "pattern not present, nothing to patch"
          exit 0
        fi
        sed -i.bak 's/JsonStatus\.message()\.as_string()/std::string(JsonStatus.message())/' "$f"
        rm -f "$f.bak"
        grep -n 'std::string(JsonStatus.message())' "$f"
    # NOTE: never put `#` comments inside a folded/literal `run:` block. YAML
    # keeps them verbatim, the folded result becomes a single shell line, and
    # the shell then treats everything after `#` as a comment -- silently
    # dropping the remaining arguments. Keep comments out here.
    #
    # LIBOMP_OMPD_GDB_SUPPORT=OFF: the OMPD GDB plugin is a shared module that
    # links LLVMSupport (and therefore the non-PIC system libz.a forced by
    # linux-static-deps.cmake). We don't ship it.
    - name: CMake
      run: >
        mkdir ${{ env.CLANGD_DIR }}

        cp llvm-project/llvm/LICENSE.TXT ${{ env.CLANGD_DIR }}

        cmake -G Ninja -S llvm-project/llvm -B ${{ env.CLANGD_DIR }}
        "-DLLVM_ENABLE_PROJECTS=clang;clang-tools-extra"
        "-DLLVM_ENABLE_RUNTIMES=compiler-rt;openmp"
        "-DLLVM_ENABLE_ASSERTIONS=OFF"
        "-DLLVM_ENABLE_BACKTRACES=ON"
        "-DLLVM_ENABLE_TERMINFO=OFF"
        "-DCMAKE_BUILD_TYPE=Release"
        "-DCLANG_PLUGIN_SUPPORT=OFF"
        "-DLLVM_ENABLE_PLUGINS=OFF"
        "-DCMAKE_C_FLAGS_RELEASE=${{ matrix.config.cflags }}"
        "-DCMAKE_CXX_FLAGS_RELEASE=${{ matrix.config.cflags }}"
        "-DCLANGD_ENABLE_REMOTE=ON"
        "-DLIBOMP_OMPD_GDB_SUPPORT=OFF"
        "-DLLVM_ENABLE_ZSTD=OFF"
        "-DGRPC_INSTALL_PATH=$HOME/grpc-installation"
        ${{ matrix.config.cmake }}
    - name: Ninja
      run: >
        ninja -C ${{ env.CLANGD_DIR }} clangd clangd-indexer clangd-index-server
        clangd-index-server-monitor runtimes
    # See "Report gRPC build errors" above: same trick for the LLVM/clangd
    # build, replaying the same target list so the failing translation unit is
    # rebuilt and its diagnostics get republished as annotations. No -k, so the
    # replay stops at the first error again instead of building everything else.
    - name: Report compile errors
      if: failure()
      shell: bash
      run: |
        set +e
        if [ ! -f "$CLANGD_DIR/build.ninja" ]; then
          echo "::error::LLVM configure failed (no build.ninja in ${CLANGD_DIR})"
          exit 0
        fi
        ninja -C "$CLANGD_DIR" clangd clangd-indexer clangd-index-server \
          clangd-index-server-monitor runtimes 2>&1 |
          grep -a -E "error:|FAILED:|fatal error|undefined reference" |
          head -5 | tr -d '\r' |
          while IFS= read -r line; do echo "::error::$(printf '%s' "$line" | sed 's/%/%25/g')"; done
        exit 0
    # Same check as the original workflow's "Check binary compatibility" step,
    # run before archiving so a bad binary never even becomes an artifact. If
    # it fails it prints the offending symbol@version pairs: force an older
    # version in lib_compat.h, or stop using the feature that pulls the newer
    # symbol in.
    - name: Check binary compatibility
      if: matrix.config.name == 'linux-x86_64'
      shell: bash
      run: >
        python3 .github/workflows/lib_compat_test.py
        --lib=${{ matrix.config.compat_lib }}
        ${{ env.CLANGD_DIR }}/bin/clangd
    - name: Archive clangd
      run: >
        7z a clangd-${{ matrix.config.name }}-${{ needs.prepare.outputs.tag_name }}.zip
        ${{ env.CLANGD_DIR }}/LICENSE.TXT
        ${{ env.CLANGD_DIR }}/bin/clangd${{ matrix.config.exe }}
        ${{ env.CLANGD_DIR }}/lib/clang
    - name: Archive indexing tools
      run: >
        7z a clangd_indexing_tools-${{ matrix.config.name }}-${{ needs.prepare.outputs.tag_name }}.zip
        ${{ env.CLANGD_DIR }}/LICENSE.TXT
        ${{ env.CLANGD_DIR }}/bin/clangd-indexer${{ matrix.config.exe }}
        ${{ env.CLANGD_DIR }}/bin/clangd-index-server${{ matrix.config.exe }}
        ${{ env.CLANGD_DIR }}/bin/clangd-index-server-monitor${{ matrix.config.exe }}
        ${{ env.CLANGD_DIR }}/lib/clang
    - name: Archive clangd PDB symbols
      if: runner.os == 'Windows'
      run: >
        7z a clangd-debug-symbols-${{ matrix.config.name }}-${{ needs.prepare.outputs.tag_name }}.7z -t7z -m0=LZMA2
        ${{ env.CLANGD_DIR }}/LICENSE.TXT
        ${{ env.CLANGD_DIR }}/bin/clangd.pdb
    - name: Upload clangd artifact
      uses: actions/upload-artifact@v7
      with:
        name: clangd-${{ matrix.config.name }}
        path: clangd-${{ matrix.config.name }}-${{ needs.prepare.outputs.tag_name }}.zip
        if-no-files-found: error
    - name: Upload indexing tools artifact
      uses: actions/upload-artifact@v7
      with:
        name: clangd_indexing_tools-${{ matrix.config.name }}
        path: clangd_indexing_tools-${{ matrix.config.name }}-${{ needs.prepare.outputs.tag_name }}.zip
        if-no-files-found: error
    - name: Upload clangd PDB artifact
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v7
      with:
        name: clangd-debug-symbols-${{ matrix.config.name }}
        path: clangd-debug-symbols-${{ matrix.config.name }}-${{ needs.prepare.outputs.tag_name }}.7z
        if-no-files-found: error

  # Merge the two native macOS builds into one universal bundle. lipo has to
  # run on macOS, and the arm64 slice's lib/clang headers are identical to the
  # x86_64 ones, so start from that tree and only lipo the executables.
  macos-universal:
    name: macos (universal)
    needs: [prepare, build]
    if: always() && needs.build.result == 'success'
    runs-on: macos-15
    steps:
    - name: Fetch the two macOS slices
      uses: actions/download-artifact@v8
      with:
        pattern: clangd-macos-*
        path: slices
    - name: Lipo the slices together
      shell: bash
      run: |
        set -euo pipefail
        tag='${{ needs.prepare.outputs.tag_name }}'
        dir="clangd_${tag}"
        bins="clangd clangd-indexer clangd-index-server clangd-index-server-monitor"
        for arch in x86_64 arm64; do
          zip="slices/clangd-macos-${arch}/clangd-macos-${arch}-${tag}.zip"
          mkdir -p "in-${arch}"
          unzip -q -o "$zip" -d "in-${arch}"
          test -f "in-${arch}/${dir}/bin/clangd"
        done
        rm -rf out && cp -R "in-arm64/${dir}" out
        for b in $bins; do
          lipo -create "in-x86_64/${dir}/bin/${b}" "in-arm64/${dir}/bin/${b}" -output "out/bin/${b}"
        done
        archs=$(lipo -archs out/bin/clangd)
        echo "clangd slices: ${archs}"
        case "$archs" in
          *x86_64*arm64*|*arm64*x86_64*) ;;
          *) echo "::error::universal binary is missing a slice: ${archs}"; exit 1 ;;
        esac
        cd out
        zip -q -r "../clangd-macos-${tag}.zip" "${dir}/LICENSE.TXT" "${dir}/bin/clangd" "${dir}/lib/clang"
        zip -q -r "../clangd_indexing_tools-macos-${tag}.zip" "${dir}/LICENSE.TXT" \
          "${dir}/bin/clangd-indexer" "${dir}/bin/clangd-index-server" \
          "${dir}/bin/clangd-index-server-monitor" "${dir}/lib/clang"
        unzip -l "../clangd-macos-${tag}.zip" | tail -3
    - name: Upload clangd artifact
      uses: actions/upload-artifact@v7
      with:
        name: clangd-macos
        path: clangd-macos-${{ needs.prepare.outputs.tag_name }}.zip
        if-no-files-found: error
    - name: Upload indexing tools artifact
      uses: actions/upload-artifact@v7
      with:
        name: clangd_indexing_tools-macos
        path: clangd_indexing_tools-macos-${{ needs.prepare.outputs.tag_name }}.zip
        if-no-files-found: error

  release:
    name: Publish release
    needs: [prepare, build, macos-universal]
    if: always() && needs.prepare.outputs.release_tag != '' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        path: dist
        merge-multiple: true
    - name: Create or update release
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        TAG: ${{ needs.prepare.outputs.release_tag }}
        RELEASE_NAME: ${{ needs.prepare.outputs.release_name }}
        LLVM_REPO: ${{ needs.prepare.outputs.llvm_repo }}
        LLVM_COMMIT: ${{ needs.prepare.outputs.llvm_commit }}
      run: |
        set -euo pipefail
        ls -l dist
        notes="Built from ${LLVM_REPO}@${LLVM_COMMIT}.

        | target | notes |
        | --- | --- |
        | linux-x86_64 | built with lib_compat.h, runs on glibc 2.17+ |
        | linux-aarch64 | built on Ubuntu 24.04 |
        | windows-x86_64 | MSVC, static CRT |
        | winarm64 | MSVC, static CRT, arm64 |
        | macos | universal (x86_64 + arm64), macOS 15 SDK |"
        if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
        else
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_NAME" --notes "$notes" --prerelease
        fi
