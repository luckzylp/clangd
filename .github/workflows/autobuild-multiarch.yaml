# Build clangd release binaries for every supported OS/architecture.
#
# This workflow is additive: it does not modify, reuse or depend on
# autobuild.yaml or winget.yml. Targets:
#
#   linux-x86_64    built inside an Ubuntu 20.04 container, using exactly the
#                   same old-glibc scheme as autobuild.yaml:
#                     - lib_compat.h pins the libm symbols to the arch
#                       baseline: GLIBC_2.2.5 on x86_64, GLIBC_2.17 on arm64
#                     - -static-libgcc + LLVM_STATIC_LINK_CXX_STDLIB=ON
#                     - LLVM_ENABLE_ZLIB=FORCE_ON with linux-static-deps.cmake
#                       forcing the static libz.a
#                     - lib_compat_test.py --lib=GLIBC_2.18, the same
#                       whitelist the original workflow enforces
#                     - getentropy_compat.c defines getentropy() locally:
#                       abseil >= 20240722 calls that glibc 2.25 symbol when
#                       built against 2.25+ headers (focal is 2.31) and it has
#                       no older version to pin
#                   GLIBC_2.18 only added __cxa_thread_atexit_impl, which is a
#                   weak reference, so the resulting binary still runs on
#                   systems with glibc 2.17.
#   linux-aarch64   built inside an Ubuntu 20.04 arm64 container, with the
#                   same scheme; lib_compat.h pins to GLIBC_2.17 instead,
#                   because aarch64 only exists since 2.17.
#   windows-x86_64  built natively with MSVC on windows-2022.
#   (winarm64 is disabled: the arm64 MSVC shipped by the VS2026 image hits
#    compiler defect C1001 on this tree. See the note in the matrix.)
#   macos           native arm64 build on macos-15 (deployment 11.0). No
#                   x86_64 slice: macos-15-intel cannot finish this tree
#                   inside GitHub's six hour job limit, and a universal
#                   build on one host leaves BoringSSL with fat archives
#                   containing objects for the wrong architecture.
#
# Artifacts are uploaded by each build job and then attached to a GitHub
# release by one short job at the end: tag snapshot_<date>, title
# "<date> @<sha12>", body "Unstable snapshot of clangd on <date>." plus the
# LLVM commit - the same shape autobuild.yaml publishes. It is created as a
# draft and published once every asset is uploaded, so a failed run never
# leaves a half-populated public release; uploading from one short job also
# avoids the "token expired after one hour" problem of uploading from
# multi-hour build jobs.
#
# Asset naming note: assets that would collide with the winget publishing
# workflow (which looks for `clangd-windows-*.zip`) are kept unique. Only the
# x86_64 Windows archive starts with `clangd-windows-`. If the arm64 Windows
# target ever comes back, publish it as `clangd-winarm64-*` so winget keeps
# picking the x64 build.
#
# Every target builds the same gRPC release (env.GRPC_VERSION) so there is one
# dependency stack to reason about. The price is that clangd-index-server-monitor
# is not built: it does not compile against any protobuf new enough for the
# arm64 toolchains (details above the "Ninja" step).
name: Build multi-arch release binaries

on:
  # Run weekly on sunday at 21:37 UTC (arbitrary, same slot as autobuild.yaml).
  schedule:
  - cron: '37 21 * * SUN'
  workflow_dispatch:
    inputs:
      llvm_repo:
        description: 'LLVM repository to build from (owner/name)'
        required: false
        default: 'llvm/llvm-project'
      llvm_commit:
        description: 'LLVM commit SHA (default: tip of the default branch)'
        required: false
        default: ''
      release_tag:
        description: 'Release tag and artifact name suffix (default: snapshot_<date>)'
        required: false
        default: ''
      release_name:
        description: 'Release title (default: "<date> @<short commit>")'
        required: false
        default: ''

# One gRPC release for every target. Must stay >= v1.68: earlier releases
# bundle an abseil whose macOS randen flags are emitted as two list items
# ("-Xarch_x86_64" "-maes" "-msse4.1"), which collapses into
# "-Xarch_x86_64 -maes -msse4.1" on the command line, so -msse4.1 reaches the
# arm64 compile and clang rejects it. abseil fixed that with
# "SHELL:-Xarch_<arch> <flag>" in 20240722, first shipped by gRPC 1.68.0.
#
# v1.69.0 is the last gRPC that builds as C++14, which keeps the Ubuntu 20.04
# container (clang-12 + libstdc++ 9) on the least demanding configuration. Note
# that gRPC has no LTS releases (their FAQ says so); 1.69 is the one release
# that ever got a written one-year bug/security commitment (proposal L120),
# because it was the final C++14 line.
#
# See the comment above the "Ninja" step for why clangd-index-server-monitor
# is no longer built.
env:
  GRPC_VERSION: v1.69.0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve build inputs
    runs-on: ubuntu-latest
    outputs:
      llvm_repo: ${{ steps.resolve.outputs.llvm_repo }}
      llvm_commit: ${{ steps.resolve.outputs.llvm_commit }}
      tag_name: ${{ steps.resolve.outputs.tag_name }}
      release_date: ${{ steps.resolve.outputs.release_date }}
      release_name: ${{ steps.resolve.outputs.release_name }}
    steps:
    - name: Resolve repository, commit and tag
      id: resolve
      shell: bash
      env:
        INPUT_REPO: ${{ github.event.inputs.llvm_repo }}
        INPUT_COMMIT: ${{ github.event.inputs.llvm_commit }}
        INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        INPUT_RELEASE_NAME: ${{ github.event.inputs.release_name }}
      run: |
        set -euo pipefail
        repo="${INPUT_REPO:-llvm/llvm-project}"
        commit="${INPUT_COMMIT:-}"
        if [ -z "$commit" ]; then
          for branch in main master; do
            commit="$(curl -fsSL "https://api.github.com/repos/${repo}/commits/${branch}" |
              jq -r '.sha // empty' || true)"
            [ -n "$commit" ] && break
          done
        fi
        if [ -z "$commit" ]; then
          echo "::error::Could not resolve the LLVM commit for ${repo}"
          exit 1
        fi
        date="$(date -u +%Y%m%d)"
        tag="${INPUT_RELEASE_TAG:-snapshot_${date}}"
        name="${INPUT_RELEASE_NAME:-${date} @$(printf '%.12s' "$commit")}"
        {
          echo "llvm_repo=${repo}"
          echo "llvm_commit=${commit}"
          echo "tag_name=${tag}"
          echo "release_date=${date}"
          echo "release_name=${name}"
        } >>"$GITHUB_OUTPUT"
        cat "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.config.name }}
    needs: prepare
    runs-on: ${{ matrix.config.os }}
    container: ${{ matrix.config.container }}
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: linux-x86_64
          os: ubuntu-24.04
          container: ubuntu:20.04
          # Same approach as autobuild.yaml: build in a container whose glibc
          # is old enough that clangd does not pick up newer symbols, force the
          # few libm symbols that would otherwise be versioned higher via
          # lib_compat.h, link libstdc++/libgcc statically, and force the static
          # libz.a so nothing new leaks into the dynamic dependency list.
          # No Launchpad PPA here: ppa:git-core periodically drops old series,
          # and when the focal pocket disappears apt-get update fails the whole
          # job. focal's git 2.25 is enough for what the build needs.
          preinstall: >-
            apt-get update &&
            apt-get install -y ninja-build libz-dev libc-ares-dev wget clang-12
            git p7zip-full curl binutils python3 python3.8 python3.8-dev
          # focal ships CMake 3.16, the Kitware bionic repo tops out at 3.25.2
          # and current LLVM wants >= 3.31, so install a pinned CMake instead.
          cmake_url: https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-linux-x86_64.tar.gz
          cflags: -O3 -gline-tables-only -DNDEBUG -include $GITHUB_WORKSPACE/.github/workflows/lib_compat.h
          # clang-12 rather than clang-10: current LLVM no longer builds with
          # the focal default toolchain.
          cmake: >-
            "-DCMAKE_C_COMPILER=clang-12"
            "-DCMAKE_CXX_COMPILER=clang++-12"
            "-DCMAKE_EXE_LINKER_FLAGS_RELEASE=-static-libgcc -Wl,--compress-debug-sections=zlib $GITHUB_WORKSPACE/getentropy_compat.o"
            "-DLLVM_STATIC_LINK_CXX_STDLIB=ON"
            "-DLLVM_ENABLE_ZLIB=FORCE_ON"
            "-DCMAKE_PROJECT_INCLUDE=$GITHUB_WORKSPACE/.github/workflows/linux-static-deps.cmake"
            "-DCMAKE_PREFIX_PATH=$HOME/grpc-installation"
          grpc_cmake: >-
            "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
          # Same whitelist as autobuild.yaml. GLIBC_2.18's only addition is
          # __cxa_thread_atexit_impl, referenced weakly, so this still yields a
          # binary usable on glibc 2.17 systems.
          compat_lib: GLIBC_2.18
          exe: ""
        - name: linux-aarch64
          os: ubuntu-24.04-arm
          container: ubuntu:20.04
          # Same old-glibc scheme as linux-x86_64, now for arm64: focal's glibc
          # is 2.31 while the target baseline is 2.17 (aarch64 was added in
          # 2.17, so that is the oldest version any aarch64 symbol can have),
          # and the gap is closed the same way - forced symbol versions, static
          # libstdc++/libgcc, static libz - instead of shipping a binary that
          # needs whatever glibc the runner happens to have. clang-12, libz and
          # c-ares are all published for focal/arm64.
          preinstall: >-
            apt-get update &&
            apt-get install -y ninja-build libz-dev libc-ares-dev wget clang-12
            git p7zip-full curl binutils python3 python3.8 python3.8-dev
          cmake_url: https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-linux-aarch64.tar.gz
          # COMPAT_SYMBOL_VERSION=GLIBC_2.17 rather than the x86_64 default:
          # aarch64 has no symbols older than 2.17. CMAKE_PREFIX_PATH points
          # at the gRPC install prefix so its config-mode lookups of absl /
          # c-ares / re2 / protobuf (made without REQUIRED) resolve.
          cflags: -O3 -gline-tables-only -DNDEBUG -DCOMPAT_SYMBOL_VERSION=GLIBC_2.17 -include $GITHUB_WORKSPACE/.github/workflows/lib_compat.h
          cmake: >-
            "-DCMAKE_C_COMPILER=clang-12"
            "-DCMAKE_CXX_COMPILER=clang++-12"
            "-DCMAKE_EXE_LINKER_FLAGS_RELEASE=-static-libgcc -Wl,--compress-debug-sections=zlib $GITHUB_WORKSPACE/getentropy_compat.o"
            "-DLLVM_STATIC_LINK_CXX_STDLIB=ON"
            "-DLLVM_ENABLE_ZLIB=FORCE_ON"
            "-DCMAKE_PROJECT_INCLUDE=$GITHUB_WORKSPACE/.github/workflows/linux-static-deps.cmake"
            "-DCMAKE_PREFIX_PATH=$HOME/grpc-installation"
          grpc_cmake: >-
            "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
          # Same whitelist as the x86_64 target and autobuild.yaml.
          compat_lib: GLIBC_2.18
          exe: ""

        - name: windows-x86_64
          os: windows-2022
          # No nasm: BoringSSL only needs it when assembly is enabled (see
          # grpc_cmake below), and ninja is already on the image.
          preinstall: choco install ninja
          msvc_arch: x64
          msvc_component: x86.x64
          cflags: /O2 /DNDEBUG
          cmake: >-
            "-DCMAKE_C_COMPILER=cl"
            "-DCMAKE_CXX_COMPILER=cl"
            "-DLLVM_ENABLE_ZLIB=OFF"
            "-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded"
            "-DLLVM_ENABLE_PDB=ON"
            "-DLLVM_PARALLEL_LINK_JOBS=1"
            "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
            "-DCMAKE_PREFIX_PATH=$HOME/grpc-installation"
          # BoringSSL's CMakeLists does enable_language(ASM_NASM) on Windows x64
          # unless OPENSSL_NO_ASM is set, and a choco-installed nasm is not on
          # PATH for later steps (the job environment is fixed at start), so
          # configure fails with "No CMAKE_ASM_NASM_COMPILER could be found".
          # Build the C implementations instead, like the arm64 and macOS
          # targets already do. Only TLS throughput of the remote index client
          # is affected.
          # gRPC_MSVC_STATIC_RUNTIME only rewrites /MD to /MT in the flag
          # strings, which the subprojects override: abseil defaults
          # ABSL_MSVC_STATIC_RUNTIME to OFF and sets CMAKE_MSVC_RUNTIME_LIBRARY
          # for its own directory, and gRPC force-sets protobuf's
          # protobuf_MSVC_STATIC_RUNTIME to OFF in the cache before adding it,
          # so those objects come out as /MD and linking against our /MT clangd
          # fails with LNK2019 on __imp_ symbols. Pin both from the command
          # line, which wins over their CACHE defaults.
          grpc_cmake: >-
            "-DgRPC_MSVC_STATIC_RUNTIME=ON"
            "-DABSL_MSVC_STATIC_RUNTIME=ON"
            "-Dprotobuf_MSVC_STATIC_RUNTIME=ON"
            "-DOPENSSL_NO_ASM=ON"
          exe: ".exe"
        # winarm64 is intentionally absent. The arm64 MSVC in the VS2026 image
        # (14.52) hits a known compiler defect -- "fatal error C1001 ... cl!Utc
        # BldCompileSerializedFile" -- on LLVM translation units, and Microsoft
        # only fixed it in 19.51, which is still preview. Dropping MLIR through
        # CLANG_ENABLE_CIR=OFF removed the first victim, but the toolchain stays
        # unreliable for this tree, so the target is out until the image ships a
        # fixed compiler. To restore it, add a matrix entry with:
        #   os: windows-11-vs2026-arm
        #   msvc_arch: arm64
        #   msvc_component: ARM64
        #   cflags: /O2 /DNDEBUG
        #   cmake: the windows-x86_64 list (cl, static CRT, LLVM_ENABLE_PDB=ON,
        #          CMAKE_PREFIX_PATH to the gRPC prefix) plus
        #          CMAKE_DISABLE_PRECOMPILE_HEADERS=ON
        #   grpc_cmake: the windows-x86_64 list (gRPC/ABSL/protobuf static
        #          runtime + OPENSSL_NO_ASM, there is no arm64 assembler path)
        #   exe: ".exe"
        # and name its archives clangd-winarm64-* so the winget workflow keeps
        # matching only clangd-windows-*.zip (see the note at the top).
        # macOS is built natively for arm64 only. The x86_64 slice used to be
        # built on macos-15-intel, but that runner cannot finish this tree
        # inside GitHub's six hour job limit: gRPC alone takes about 47 minutes
        # there, and Ninja was still running when the job was killed at 6h00m.
        # A universal build on one host is not an option either: BoringSSL has
        # arch-specific sources and ends up with fat archives containing
        # objects for the wrong slice. Hence arm64 native, with no lipo step.
        - name: macos
          os: macos-15
          preinstall: brew install ninja zlib p7zip
          # The image's CMake is 4.x, which rejects the cmake_minimum_required
          # of older gRPC releases. Pin 3.31 instead.
          cmake_url: https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-macos-universal.tar.gz
          cflags: -O3 -gline-tables-only -DNDEBUG
          cmake: >-
            "-DCMAKE_C_COMPILER=clang"
            "-DCMAKE_CXX_COMPILER=clang++"
            "-DLLVM_ENABLE_ZLIB=FORCE_ON"
            "-DCMAKE_OSX_ARCHITECTURES=arm64"
            "-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0"
            "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
            "-DCMAKE_PREFIX_PATH=$HOME/grpc-installation"
          # macOS ships zlib in the SDK, and gRPC's bundled copy does not
          # compile against the macOS 15 SDK (zutil.c blows up inside
          # _stdio.h). Use the system one instead of building zlib.
          grpc_cmake: >-
            "-DOPENSSL_NO_ASM=ON"
            "-DgRPC_ZLIB_PROVIDER=package"
          # compiler-rt on Darwin builds variants for macOS, iOS, tvOS and
          # watchOS, none of which clangd uses - it only needs the builtin
          # headers under lib/clang/<ver>/include - and they cost time this job
          # does not have. Request the resource headers explicitly instead, so
          # lib/clang still exists for the archive step.
          targets: clangd clangd-indexer clangd-index-server clang-resource-headers
          exe: ""
    steps:
    - name: Clone build scripts
      uses: actions/checkout@v5
    # The MSVC environment is located through vswhere instead of hardcoding
    # the install path, so the same step works for VS2022 on windows-2022 and
    # for VS2026 on the arm64 image, in any edition.
    - name: Set up MSVC environment
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
        if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found: $vswhere" }
        $component = "Microsoft.VisualStudio.Component.VC.Tools.${{ matrix.config.msvc_component }}"
        $vsPath = & $vswhere -latest -products * -requires $component -property installationPath
        if (-not $vsPath) { throw "No Visual Studio installation provides $component" }
        $vcvars = Join-Path $vsPath 'VC\Auxiliary\Build\vcvarsall.bat'
        Write-Host "Using $vcvars with architecture ${{ matrix.config.msvc_arch }}"
        cmd /c "`"$vcvars`" ${{ matrix.config.msvc_arch }} >NUL && set" | ForEach-Object {
          $name, $value = $_ -split '=', 2
          if ($value) { "$name=$value" >> $env:GITHUB_ENV }
        }
    - name: Install tools
      if: ${{ matrix.config.preinstall }}
      run: ${{ matrix.config.preinstall }}
    # Current llvm-project requires CMake >= 3.31, and the images we build on
    # ship either older ones (focal: 3.16 via apt, noble: 3.28) or a 4.x that
    # is too new for the pinned gRPC release. Download one known version and
    # put it in front of PATH. The macOS tarball nests the binaries in
    # CMake.app/Contents/bin, hence the layout probe.
    - name: Install pinned CMake
      if: ${{ matrix.config.cmake_url }}
      shell: bash
      run: |
        set -euo pipefail
        dest="$HOME/.local/cmake"
        mkdir -p "$dest"
        curl -fsSL "${{ matrix.config.cmake_url }}" -o "$HOME/cmake.tar.gz"
        tar -xzf "$HOME/cmake.tar.gz" -C "$dest" --strip-components=1
        bindir="$dest/bin"
        [ -x "$bindir/cmake" ] || bindir="$dest/CMake.app/Contents/bin"
        [ -x "$bindir/cmake" ] || { echo "::error::cmake not found in the archive"; exit 1; }
        "$bindir/cmake" --version
        echo "$bindir" >>"$GITHUB_PATH"
    - name: Show toolchain versions
      shell: bash
      run: |
        cmake --version | head -1
        ninja --version
    # abseil 20240722 (the version every target shares through gRPC 1.69)
    # calls getentropy() when it is compiled against glibc >= 2.25, and the
    # focal container's headers are 2.31. That would make clangd import
    # getentropy@GLIBC_2.25, which the compatibility gate rejects. Unlike the
    # libm symbols in lib_compat.h there is no older version of getentropy to
    # force, so link a local definition instead; see getentropy_compat.c.
    - name: Build old-glibc compat stubs
      if: matrix.config.compat_lib != ''
      shell: bash
      run: |
        set -euo pipefail
        clang-12 -O2 -Wall -Wextra -c \
          "$GITHUB_WORKSPACE/.github/workflows/getentropy_compat.c" \
          -o "$GITHUB_WORKSPACE/getentropy_compat.o"
        echo "undefined symbols in the stub (all must predate glibc 2.18):"
        nm -u "$GITHUB_WORKSPACE/getentropy_compat.o"
    - name: Clone gRPC
      uses: actions/checkout@v5
      with:
        repository: grpc/grpc
        path: grpc
        ref: ${{ env.GRPC_VERSION }}
        submodules: recursive
    - name: Build gRPC
      run: >
        mkdir $HOME/grpc-installation

        mkdir grpc-build

        cmake -G Ninja -S grpc -B grpc-build
        "-DgRPC_INSTALL=ON"
        "-DCMAKE_INSTALL_PREFIX=$HOME/grpc-installation"
        "-DCMAKE_BUILD_TYPE=Release"
        "-DCMAKE_C_FLAGS_RELEASE=${{ matrix.config.cflags }}"
        "-DCMAKE_CXX_FLAGS_RELEASE=${{ matrix.config.cflags }}"
        ${{ matrix.config.grpc_cmake }} ${{ matrix.config.cmake }}

        ninja -C grpc-build install
    # GitHub job logs need authentication to download, so a failed run is
    # otherwise a black box. Replay the failing build (ninja resumes where it
    # stopped) and republish the first errors as workflow annotations, which
    # are readable anonymously.
    - name: Report gRPC build errors
      if: failure()
      shell: bash
      run: |
        set +e
        if [ ! -f grpc-build/build.ninja ]; then
          # A failure in an earlier step (Install tools, Clone gRPC) also lands
          # here, so this is a hint, not the root cause.
          echo "::warning::no grpc-build/build.ninja - gRPC configure did not complete"
          exit 0
        fi
        ninja -C grpc-build install 2>&1 |
          grep -a -E "error:|FAILED:|fatal error|CMake Error" |
          head -5 | tr -d '\r' |
          while IFS= read -r line; do echo "::error::$(printf '%s' "$line" | sed 's/%/%25/g')"; done
        exit 0
    - name: Clone LLVM
      uses: actions/checkout@v5
      with:
        repository: ${{ needs.prepare.outputs.llvm_repo }}
        path: llvm-project
        ref: ${{ needs.prepare.outputs.llvm_commit }}
    - name: Set build directory
      shell: bash
      run: echo "CLANGD_DIR=clangd_${{ needs.prepare.outputs.tag_name }}" >> "$GITHUB_ENV"
    # NOTE: never put `#` comments inside a folded/literal `run:` block. YAML
    # keeps them verbatim, the folded result becomes a single shell line, and
    # the shell then treats everything after `#` as a comment -- silently
    # dropping the remaining arguments. Keep comments out here.
    #
    # LIBOMP_OMPD_GDB_SUPPORT=OFF: the OMPD GDB plugin is a shared module that
    # links LLVMSupport (and therefore the non-PIC system libz.a forced by
    # linux-static-deps.cmake). We don't ship it.
    #
    # CLANG_ENABLE_CIR defaults to ON in llvm/CMakeLists.txt, and when clang is
    # in LLVM_ENABLE_PROJECTS it silently appends mlir as a dependency-only
    # project:
    #
    #   option(CLANG_ENABLE_CIR "Build ClangIR support into the compiler" ON)
    #   if (CLANG_ENABLE_CIR AND "clang" IN_LIST LLVM_ENABLE_PROJECTS ...)
    #     list(APPEND LLVM_ENABLE_PROJECTS "mlir")
    #
    # That is why a build asking only for clang;clang-tools-extra still
    # compiles tools/mlir/mlir-tblgen. Nothing we ship uses ClangIR, and on
    # Windows arm64 those extra translations units are what crash: MSVC 14.52
    # dies with C1001 (UtcBldCompileSerializedFile, i.e. the known bit-field
    # ICE that Microsoft only fixed in 19.51) on
    # mlir/tools/mlir-tblgen/OpDefinitionsGen.cpp. Turning CIR off keeps MLIR
    # out of the build entirely.
    - name: CMake
      run: >
        mkdir ${{ env.CLANGD_DIR }}

        cp llvm-project/llvm/LICENSE.TXT ${{ env.CLANGD_DIR }}

        cmake -G Ninja -S llvm-project/llvm -B ${{ env.CLANGD_DIR }}
        "-DLLVM_ENABLE_PROJECTS=clang;clang-tools-extra"
        "-DCLANG_ENABLE_CIR=OFF"
        "-DLLVM_ENABLE_RUNTIMES=compiler-rt;openmp"
        "-DLLVM_ENABLE_ASSERTIONS=OFF"
        "-DLLVM_ENABLE_BACKTRACES=ON"
        "-DLLVM_ENABLE_TERMINFO=OFF"
        "-DCMAKE_BUILD_TYPE=Release"
        "-DCLANG_PLUGIN_SUPPORT=OFF"
        "-DLLVM_ENABLE_PLUGINS=OFF"
        "-DCMAKE_C_FLAGS_RELEASE=${{ matrix.config.cflags }}"
        "-DCMAKE_CXX_FLAGS_RELEASE=${{ matrix.config.cflags }}"
        "-DCLANGD_ENABLE_REMOTE=ON"
        "-DLIBOMP_OMPD_GDB_SUPPORT=OFF"
        "-DLLVM_ENABLE_ZSTD=OFF"
        "-DGRPC_INSTALL_PATH=$HOME/grpc-installation"
        ${{ matrix.config.cmake }}
    # clangd-index-server-monitor is deliberately not built: it calls
    # Status::message().as_string(), which only compiles against protobuf whose
    # Status returns Abseil's own string_view. Every gRPC release newer than
    # 1.36.x bundles an abseil that aliases absl::string_view to
    # std::string_view in C++17 (options.h hard-codes
    # ABSL_OPTION_USE_STD_STRING_VIEW 2 since 20220623), and 1.36.x cannot be
    # built for arm64 or on current toolchains. Building one current gRPC for
    # all targets is worth more than this one monitoring CLI, and it avoids
    # carrying a patch against LLVM's source.
    - name: Ninja
      run: >
        ninja -C ${{ env.CLANGD_DIR }} ${{ matrix.config.targets ||
        'clangd clangd-indexer clangd-index-server runtimes' }}
    # See "Report gRPC build errors" above: same trick for the LLVM/clangd
    # build, replaying the same target list so the failing translation unit is
    # rebuilt and its diagnostics get republished as annotations. No -k, so the
    # replay stops at the first error again instead of building everything else.
    - name: Report compile errors
      if: failure()
      shell: bash
      run: |
        set +e
        if [ -z "${CLANGD_DIR:-}" ] || [ ! -f "$CLANGD_DIR/build.ninja" ]; then
          echo "::warning::no LLVM build.ninja (CLANGD_DIR=${CLANGD_DIR:-unset}) - configure did not complete"
          exit 0
        fi
        ninja -C "$CLANGD_DIR" ${{ matrix.config.targets || 'clangd clangd-indexer clangd-index-server runtimes' }} 2>&1 |
          grep -a -E "error:|FAILED:|fatal error|undefined reference" |
          head -5 | tr -d '\r' |
          while IFS= read -r line; do echo "::error::$(printf '%s' "$line" | sed 's/%/%25/g')"; done
        exit 0
    # Same check as the original workflow's "Check binary compatibility" step,
    # run before archiving so a bad binary never even becomes an artifact. If
    # it fails it prints the offending symbol@version pairs: force an older
    # version in lib_compat.h, or stop using the feature that pulls the newer
    # symbol in.
    - name: Check binary compatibility
      if: matrix.config.compat_lib != ''
      shell: bash
      run: >
        python3 .github/workflows/lib_compat_test.py
        --lib=${{ matrix.config.compat_lib }}
        ${{ env.CLANGD_DIR }}/bin/clangd
    - name: Archive clangd
      run: >
        7z a clangd-${{ matrix.config.name }}-${{ needs.prepare.outputs.tag_name }}.zip
        ${{ env.CLANGD_DIR }}/LICENSE.TXT
        ${{ env.CLANGD_DIR }}/bin/clangd${{ matrix.config.exe }}
        ${{ env.CLANGD_DIR }}/lib/clang
    - name: Archive indexing tools
      run: >
        7z a clangd_indexing_tools-${{ matrix.config.name }}-${{ needs.prepare.outputs.tag_name }}.zip
        ${{ env.CLANGD_DIR }}/LICENSE.TXT
        ${{ env.CLANGD_DIR }}/bin/clangd-indexer${{ matrix.config.exe }}
        ${{ env.CLANGD_DIR }}/bin/clangd-index-server${{ matrix.config.exe }}
        ${{ env.CLANGD_DIR }}/lib/clang
    - name: Archive clangd PDB symbols
      if: runner.os == 'Windows'
      run: >
        7z a clangd-debug-symbols-${{ matrix.config.name }}-${{ needs.prepare.outputs.tag_name }}.7z -t7z -m0=LZMA2
        ${{ env.CLANGD_DIR }}/LICENSE.TXT
        ${{ env.CLANGD_DIR }}/bin/clangd.pdb
    - name: Upload clangd artifact
      uses: actions/upload-artifact@v7
      with:
        name: clangd-${{ matrix.config.name }}
        path: clangd-${{ matrix.config.name }}-${{ needs.prepare.outputs.tag_name }}.zip
        if-no-files-found: error
    - name: Upload indexing tools artifact
      uses: actions/upload-artifact@v7
      with:
        name: clangd_indexing_tools-${{ matrix.config.name }}
        path: clangd_indexing_tools-${{ matrix.config.name }}-${{ needs.prepare.outputs.tag_name }}.zip
        if-no-files-found: error
    - name: Upload clangd PDB artifact
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v7
      with:
        name: clangd-debug-symbols-${{ matrix.config.name }}
        path: clangd-debug-symbols-${{ matrix.config.name }}-${{ needs.prepare.outputs.tag_name }}.7z
        if-no-files-found: error

  # Mirrors what autobuild.yaml publishes: tag snapshot_<date>, title
  # "<date> @<sha12>", body "Unstable snapshot of clangd on <date>." plus the
  # LLVM commit. Created as a draft and published only after every asset is
  # uploaded, so a failed upload never leaves a half-populated public release.
  release:
    name: Publish release
    needs: [prepare, build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Clone build scripts
      uses: actions/checkout@v5
    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        path: dist
        merge-multiple: true
    - name: Create or update release
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        TAG: ${{ needs.prepare.outputs.tag_name }}
        RELEASE_NAME: ${{ needs.prepare.outputs.release_name }}
        RELEASE_DATE: ${{ needs.prepare.outputs.release_date }}
        LLVM_REPO: ${{ needs.prepare.outputs.llvm_repo }}
        LLVM_COMMIT: ${{ needs.prepare.outputs.llvm_commit }}
      run: |
        set -euo pipefail
        ls -l dist
        # The changelog lives in release-notes.md so the build environment and
        # the differences from autobuild.yaml can be reviewed like any other
        # change. GRPC_VERSION comes from the workflow-level env.
        sed -e "s|{{DATE}}|${RELEASE_DATE}|g" \
            -e "s|{{LLVM_REPO}}|${LLVM_REPO}|g" \
            -e "s|{{LLVM_COMMIT}}|${LLVM_COMMIT}|g" \
            -e "s|{{GRPC_VERSION}}|${GRPC_VERSION}|g" \
            .github/workflows/release-notes.md > notes.md
        if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          # Re-run on the same day: keep the tag, replace the assets and notes.
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
        else
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_NAME" --notes-file notes.md --draft --prerelease
        fi
        gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
